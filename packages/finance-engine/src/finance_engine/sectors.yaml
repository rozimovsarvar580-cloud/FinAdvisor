schema_version: 1
sectors:
  - id: restaurant_cafe
    names: {en: Restaurant or cafe, ru: Ресторан или кафе, uz: Restoran yoki kafe}
    revenue_model_type: capacity_utilization
    cost_categories: [ingredients, rent, utilities, payroll, equipment, delivery_fees, marketing]
    staff_roles: [owner, cook, server, cashier, manager]
    inventory_cogs_behavior:
      inventory_tracking: user_input
      cogs_basis: percent_of_revenue_or_unit_cost
      user_supplied_only: true
    kpis: [revenue, food_cost, payroll_cost, average_check, capacity_utilization, break_even]
    questions:
      en:
        - "What products or services will you offer?"
        - "Which operating costs and staff roles should the plan include?"
        - "Which permits or registrations, if any, should be verified for this activity?"
      ru:
        - "Какие товары или услуги вы будете предлагать?"
        - "Какие операционные расходы и роли сотрудников нужно включить в план?"
        - "Какие разрешения или регистрации, если они нужны, следует проверить для этой деятельности?"
      uz:
        - "Qaysi mahsulot yoki xizmatlarni taklif qilasiz?"
        - "Rejaga qaysi operatsion xarajatlar va xodim rollarini kiritish kerak?"
        - "Bu faoliyat uchun zarur bo‘lishi mumkin bo‘lgan qaysi ruxsat yoki ro‘yxatdan o‘tish talablarini tekshirish kerak?"
    licenses_regulations: []

  - id: retail_shop
    names: {en: Retail shop, ru: Розничный магазин, uz: Chakana savdo do‘koni}
    revenue_model_type: unit_sales
    cost_categories: [inventory_purchases, rent, utilities, payroll, payment_fees, storage, marketing]
    staff_roles: [owner, sales_associate, cashier, stock_clerk, manager]
    inventory_cogs_behavior:
      inventory_tracking: user_input
      cogs_basis: unit_cost
      user_supplied_only: true
    kpis: [revenue, units_sold, inventory_cost, gross_margin, average_sale, break_even]
    questions:
      en:
        - "Which products will you sell and how will you enter their prices and purchase costs?"
        - "How will you track stock and returns?"
        - "Which permits or registrations, if any, should be verified for this activity?"
      ru:
        - "Какие товары вы будете продавать и как укажете их цены и закупочную стоимость?"
        - "Как вы будете учитывать запасы и возвраты?"
        - "Какие разрешения или регистрации, если они нужны, следует проверить для этой деятельности?"
      uz:
        - "Qaysi mahsulotlarni sotasiz va ularning narxi hamda xarid qiymatini qanday kiritasiz?"
        - "Tovar zaxirasi va qaytarishlarni qanday hisoblaysiz?"
        - "Bu faoliyat uchun zarur bo‘lishi mumkin bo‘lgan qaysi ruxsat yoki ro‘yxatdan o‘tish talablarini tekshirish kerak?"
    licenses_regulations: []

  - id: online_store
    names: {en: Online store, ru: Интернет-магазин, uz: Onlayn do‘kon}
    revenue_model_type: unit_sales
    cost_categories: [inventory_purchases, platform_fees, payment_fees, fulfillment, delivery, marketing]
    staff_roles: [owner, order_manager, support_agent, packer, marketer]
    inventory_cogs_behavior:
      inventory_tracking: user_input
      cogs_basis: unit_cost
      user_supplied_only: true
    kpis: [revenue, orders, units_sold, average_order_value, fulfillment_cost, return_rate]
    questions:
      en:
        - "Which products and sales channels will you use?"
        - "Which payment, fulfillment, delivery, and return costs should be entered?"
        - "Which permits or registrations, if any, should be verified for this activity?"
      ru:
        - "Какие товары и каналы продаж вы будете использовать?"
        - "Какие расходы на оплату, обработку заказов, доставку и возвраты нужно указать?"
        - "Какие разрешения или регистрации, если они нужны, следует проверить для этой деятельности?"
      uz:
        - "Qaysi mahsulotlar va savdo kanallaridan foydalanasiz?"
        - "To‘lov, buyurtmani tayyorlash, yetkazib berish va qaytarish xarajatlaridan qaysilarini kiritish kerak?"
        - "Bu faoliyat uchun zarur bo‘lishi mumkin bo‘lgan qaysi ruxsat yoki ro‘yxatdan o‘tish talablarini tekshirish kerak?"
    licenses_regulations: []

