        - "Какие разрешения или регистрации, если они нужны, следует проверить для этой деятельности?"
      uz:
        - "Rejaga qaysi xizmatlar, ularning davomiyligi va narxlarini kiritish kerak?"
        - "Qaysi mutaxassislar, ish soatlari va sarf materiallarini ko‘rsatish kerak?"
