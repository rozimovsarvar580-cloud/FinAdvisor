[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finadvisor-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyJWT>=2.10,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  "redis>=5,<6",
  "sqlalchemy>=2.0,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finadvisor_api = ["document_messages.json", "knowledge_seed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
