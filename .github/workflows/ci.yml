name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "./apps/api[dev]" -e "./packages/finance-engine[dev]"
      - run: node scripts/verify.mjs
        env:
          JWT_SECRET: "ci-test-secret-key-at-least-32-bytes"
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace apps/web run test:e2e
      - run: npm run build
