name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./apps/api[dev]" -e "./packages/finance-engine[dev]"
      - run: ruff check apps/api packages/finance-engine
      - run: pytest apps/api/tests packages/finance-engine/tests
        env:
          JWT_SECRET: "ci-test-secret-key-at-least-32-bytes"
