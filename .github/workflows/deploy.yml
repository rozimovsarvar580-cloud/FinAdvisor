name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "./apps/api[dev]" -e "./packages/finance-engine[dev]"
      - name: Verify repository
        run: node scripts/verify.mjs
        env:
          JWT_SECRET: ci-test-secret-key-at-least-32-bytes

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SITE_DOMAIN: ${{ vars[github.ref_type == 'branch' && 'STAGING_SITE_DOMAIN' || 'PRODUCTION_SITE_DOMAIN'] }}
    outputs:
      api_image: ${{ steps.metadata.outputs.api_image }}
      web_image: ${{ steps.metadata.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image names
        id: metadata
        env:
          SITE_DOMAIN: ${{ env.SITE_DOMAIN }}
        run: |
          set -euo pipefail
          if [[ ! "$SITE_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Set the appropriate STAGING_SITE_DOMAIN or PRODUCTION_SITE_DOMAIN repository variable."
            exit 1
          fi
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            image_tag="$GITHUB_REF_NAME"
          else
            image_tag="staging-${GITHUB_SHA::12}"
          fi
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::The ref cannot be used as a container image tag."
            exit 1
          fi
          image_prefix="ghcr.io/${repository}"
          echo "api_image=${image_prefix}/api:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "web_image=${image_prefix}/web:${image_tag}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push API image
        env:
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
        run: docker buildx build --push --file apps/api/Dockerfile --tag "$API_IMAGE" .
      - name: Build and push web image
        env:
          WEB_IMAGE: ${{ steps.metadata.outputs.web_image }}
          SITE_DOMAIN: ${{ env.SITE_DOMAIN }}
        run: |
          docker buildx build --push \
            --file apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=https://api.${SITE_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_SITE_URL=https://${SITE_DOMAIN}" \
            --tag "$WEB_IMAGE" .

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      url: ${{ format('https://{0}', vars.SITE_DOMAIN) }}
    steps:
      - name: Deploy images and run migrations
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${API_IMAGE:?Image build did not produce an API image}"
          : "${WEB_IMAGE:?Image build did not produce a web image}"
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in the selected GitHub environment}"
          : "${DEPLOY_USER:?Set DEPLOY_USER in the selected GitHub environment}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in the selected GitHub environment}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in the selected GitHub environment}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/finadvisor}"
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] ||
             [[ ! "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]] ||
             [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]; then
            echo "::error::Deployment host, user, or path has an unsupported format."
            exit 1
          fi

          key_file="$RUNNER_TEMP/finadvisor_deploy_key"
          known_hosts_file="$RUNNER_TEMP/finadvisor_known_hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          export FINADVISOR_API_IMAGE="$API_IMAGE"
          export FINADVISOR_WEB_IMAGE="$WEB_IMAGE"

          docker compose -f docker-compose.prod.yml pull api scheduler web migrate
          docker compose -f docker-compose.prod.yml up -d --wait postgres redis
          docker compose -f docker-compose.prod.yml run --rm --no-deps migrate
          docker compose -f docker-compose.prod.yml up -d --no-build --no-deps --wait api scheduler web
          docker compose -f docker-compose.prod.yml up -d --no-build --no-deps proxy
          docker compose -f docker-compose.prod.yml exec -T api \
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
          docker compose -f docker-compose.prod.yml ps
          REMOTE
